<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three-Tier App</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center;
           align-items: center; height: 100vh; margin: 0; background: #f0f4f8; }
    .card { background: #fff; border-radius: 8px; padding: 2rem 3rem;
            box-shadow: 0 2px 12px rgba(0,0,0,.1); text-align: center; }
    h1 { color: #2d6cdf; }
    #message { margin-top: 1rem; font-size: 1.1rem; color: #333; }
    button { margin-top: 1.5rem; padding: .6rem 1.5rem; border: none;
             border-radius: 4px; background: #2d6cdf; color: #fff;
             font-size: 1rem; cursor: pointer; }
    button:hover { background: #1a50b0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Three-Tier App on GCP</h1>
    <div id="message">Loading…</div>
    <button onclick="fetchHello()">Call Backend API</button>
  </div>

  <script>
    const API_BASE = window.API_BASE || '/api';

    async function fetchHello() {
      const el = document.getElementById('message');
      el.textContent = 'Fetching…';
      try {
        const res = await fetch(`${API_BASE}/hello`);
        const data = await res.json();
        el.textContent = data.message || JSON.stringify(data);
      } catch (err) {
        el.textContent = 'Error: ' + err.message;
      }
    }

    // Auto-call on load
    fetchHello();
  </script>
</body>
</html>
